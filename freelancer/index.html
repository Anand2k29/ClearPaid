<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearPaid</title>
  <meta name="description" content="ClearPaid: choose the mobile app or the desktop website.">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="theme-color" content="#163300">
  <link rel="stylesheet" href="shared/app.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 28px; box-sizing: border-box; }
    .choose { width: 100%; max-width: 560px; }
    .choose .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .choose .brand svg { width: 46px; height: 46px; flex: 0 0 46px; }
    .choose h1 { font-size: 40px; letter-spacing: -.03em; line-height: 1; }
    .choose .lead { margin: 0 0 22px; font-size: 16px; max-width: 46ch; }
  </style>
</head>
<body>
  <main class="choose">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#163300"/><path d="M11.5 21.2l5.1 5.1L28.6 14" fill="none" stroke="#9fe870" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>ClearPaid</h1>
    </div>
    <p class="muted lead">Choose the version for this device. Phones use the mobile app. Laptops and large screens use the desktop website.</p>
    <div class="tile-grid">
      <a class="tile" href="mobile/index.html"><span class="tile-title">Mobile app</span><span class="tile-sub">For phones. Add it to your home screen and it opens offline.</span></a>
      <a class="tile" href="desktop/index.html"><span class="tile-title">Desktop website</span><span class="tile-sub">For laptops and large screens. Each feature has its own page.</span></a>
    </div>
  </main>
  <script>
    // Opens the right version for the screen width. Add ?pick to this address to stay on this page.
    if (!location.search.includes("pick")) {
      location.replace(window.matchMedia("(min-width: 900px)").matches ? "desktop/index.html" : "mobile/index.html");
    }
  </script>
</body>
</html>
